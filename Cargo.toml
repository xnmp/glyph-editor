[package]
name = "glyph"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2.191"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
